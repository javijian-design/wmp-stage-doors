name: Build WMP Fabric 1.21.1 Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Mod JAR
        run: gradle build
      - name: Upload Compiled Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: wmp-animated-architecture-fabric-1.21.1
          path: build/libs/*.jar
